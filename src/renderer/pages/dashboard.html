<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 4px;">System Health Status</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Real-time disk space analysis and AI recommendations</p>
    </div>
    <div style="background-color: #10b981; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 18px;" id="health-score-badge">
      95%
    </div>
  </div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
  <div class="card">
    <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 8px;">Total Disk Space</div>
    <div style="font-size: 28px; font-weight: 700;" id="dash-total-space">-- GB</div>
  </div>
  <div class="card">
    <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 8px;">Available Space</div>
    <div style="font-size: 28px; font-weight: 700; color: var(--accent-green);" id="dash-free-space">-- GB</div>
  </div>
  <div class="card">
    <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 8px;">Cleanable Junk</div>
    <div style="font-size: 28px; font-weight: 700; color: var(--accent-orange);" id="dash-cleanable">-- GB</div>
  </div>
</div>

<div class="card">
  <h3 class="card-title">Quick Actions</h3>
  <div style="display: flex; gap: 16px;">
    <button class="btn" onclick="startQuickScan()" style="font-size: 16px; padding: 12px 24px;">⚡ Start Fast Scan</button>
    <button class="btn btn-secondary" onclick="navigate('scan')" style="font-size: 16px; padding: 12px 24px;">🔍 Advanced Scan Modes</button>
  </div>
</div>

<div class="card">
  <h3 class="card-title">Recent Activity</h3>
  <div id="activity-log" style="font-size: 14px; color: var(--text-muted);">
    Loading system status...
  </div>
</div>
