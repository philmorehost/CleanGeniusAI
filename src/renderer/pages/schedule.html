<div class="card">
  <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 12px;">Automated Cleanup Schedule</h2>
  <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Configure automatic disk background scans and low disk space triggers.</p>

  <div class="form-group">
    <label class="form-label">Automatic Scan Frequency</label>
    <select class="form-select" id="schedule-freq">
      <option value="disabled">Disabled</option>
      <option value="daily">Daily</option>
      <option value="weekly" selected>Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
  </div>

  <div class="form-group">
    <label style="font-size: 14px; display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="chk-low-disk" checked> Run automatic cleanup when free space drops below 10 GB
    </label>
  </div>

  <button class="btn" onclick="alert('Schedule settings saved!')">Save Schedule Settings</button>
</div>
