<div class="card" style="max-width: 800px; margin: 0 auto;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
    <div>
      <h2 style="font-size: 22px; font-weight: 700; color: var(--primary-blue);" id="wizard-step-title">Stage 1: Welcome & System Check</h2>
      <p style="color: var(--text-muted); font-size: 13px;" id="wizard-step-subtitle">CleanGenius AI Setup & Optimization Wizard</p>
    </div>
    <div style="font-weight: 700; color: var(--text-muted); font-size: 14px;" id="wizard-step-counter">Step 1 of 5</div>
  </div>

  <!-- Stage Indicators -->
  <div style="display: flex; gap: 8px; margin-bottom: 24px;">
    <div class="wiz-bar active" id="wiz-bar-1" style="flex: 1; height: 6px; background-color: var(--primary-blue); border-radius: 3px;"></div>
    <div class="wiz-bar" id="wiz-bar-2" style="flex: 1; height: 6px; background-color: var(--border-color); border-radius: 3px;"></div>
    <div class="wiz-bar" id="wiz-bar-3" style="flex: 1; height: 6px; background-color: var(--border-color); border-radius: 3px;"></div>
    <div class="wiz-bar" id="wiz-bar-4" style="flex: 1; height: 6px; background-color: var(--border-color); border-radius: 3px;"></div>
    <div class="wiz-bar" id="wiz-bar-5" style="flex: 1; height: 6px; background-color: var(--border-color); border-radius: 3px;"></div>
  </div>

  <!-- Stage Content Container -->
  <div id="wizard-stage-content" style="min-height: 280px;">
    <!-- Rendered dynamically -->
  </div>

  <!-- Navigation Control Buttons -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 20px;">
    <button class="btn btn-secondary" id="wiz-btn-prev" onclick="wizPrevStep()" style="display: none;">← Previous</button>
    <div></div>
    <button class="btn" id="wiz-btn-next" onclick="wizNextStep()" style="font-size: 15px; padding: 10px 24px;">Next Step →</button>
  </div>
</div>
