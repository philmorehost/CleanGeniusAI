name: Build CleanGenius AI Installer (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          pytest tests/backend

      - name: Build Executable Installer (.exe)
        run: |
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CleanGenius-AI Executable Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanGenius-AI-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release with Attached .exe Installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: CleanGenius AI Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
